<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex">
<title>Sofía Bernasconi</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{ --fondo:#efeeea; --tinta:#15150f; }
  html,body{height:100%;overflow:hidden;background:var(--fondo)}
  body{font-family:'JetBrains Mono',monospace;touch-action:none}
  canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%}
  .meta{position:fixed;z-index:10;font-size:10px;letter-spacing:.26em;
        text-transform:uppercase;color:var(--tinta);opacity:.45;pointer-events:none}
  .meta.bl{bottom:4vh;left:5vw}
  .meta.br{bottom:4vh;right:5vw}
  @media(max-width:700px){ .meta{font-size:9px;letter-spacing:.18em}
    .meta.bl,.meta.br{bottom:3vh} }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="meta bl">Sofía Bernasconi</div>
<div class="meta br">2026</div>

<script>
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
// buffer de baja resolución: un píxel por carácter
const low  = document.createElement('canvas');
const lctx = low.getContext('2d', {willReadFrequently:true});
let W, H, DPR, cols, rows, cw, ch;

const RAMPA = " .·:;=+*#%@";
const CELL  = 10;

function isMobile(){ return window.innerWidth < 760; }

/* el brazo se dibuja en la retícula, en escala de grises */
function brazo(g, x0, y0, ang0, largo, curva, grosor, ext, alfa){
  const N = 64;
  const L = largo*ext, paso = L/N;
  let x=x0, y=y0, a=ang0;
  const pts=[];
  for(let i=0;i<=N;i++){
    const s=i/N;
    pts.push({x,y,r:grosor*(1-0.62*s)});
    a += curva*(0.35+s*1.25)/N;
    x += Math.cos(a)*paso; y += Math.sin(a)*paso;
  }
  g.save();
  g.globalAlpha = alfa;
  g.strokeStyle='#000'; g.fillStyle='#000';
  g.lineCap='round'; g.lineJoin='round';
  for(let i=0;i<N;i++){
    g.beginPath(); g.lineWidth=pts[i].r*2;
    g.moveTo(pts[i].x,pts[i].y); g.lineTo(pts[i+1].x,pts[i+1].y); g.stroke();
  }
  const p=pts[N], q=pts[N-1];
  const dx=p.x-q.x, dy=p.y-q.y, d=Math.hypot(dx,dy)||1;
  const ux=dx/d, uy=dy/d, r=p.r;
  const abrir = Math.max(0, Math.min(1,(ext-0.35)/0.5));
  g.beginPath();
  g.ellipse(p.x+ux*r*0.6, p.y+uy*r*0.6, r*1.25, r*1.05, Math.atan2(uy,ux),0,Math.PI*2);
  g.fill();
  for(let f=0;f<5;f++){
    const spread=(f-2)/2;
    const ang=Math.atan2(uy,ux)+spread*0.52*abrir;
    const largoF=r*(f===0?1.7:f===4?2.0:2.9-Math.abs(spread)*0.5)*(0.55+abrir*0.85);
    let fx=p.x+ux*r*1.1, fy=p.y+uy*r*1.1, fa=ang;
    const M=5;
    for(let k=0;k<M;k++){
      const s=k/M;
      const nx=fx+Math.cos(fa)*(largoF/M), ny=fy+Math.sin(fa)*(largoF/M);
      g.beginPath(); g.lineWidth=r*(0.42-0.22*s);
      g.moveTo(fx,fy); g.lineTo(nx,ny); g.stroke();
      fx=nx; fy=ny; fa+=spread*0.16;
    }
  }
  g.restore();
}

let BRAZOS=[];
function sembrar(){
  const mob=isMobile();
  BRAZOS=[
    { x:-0.06, y:0.82, ang:-0.62, largo:1.55, curva:-0.55, grosor:mob?0.055:0.042, fase:0.00, vel:0.085 },
    { x: 1.06, y:0.66, ang: 3.42, largo:1.35, curva: 0.70, grosor:mob?0.048:0.036, fase:0.38, vel:0.070 },
    { x: 0.34, y:1.08, ang:-1.34, largo:1.20, curva: 0.85, grosor:mob?0.042:0.031, fase:0.62, vel:0.095 },
    { x:-0.04, y:0.28, ang: 0.42, largo:1.10, curva: 0.60, grosor:mob?0.036:0.027, fase:0.81, vel:0.062 },
    { x: 1.05, y:1.02, ang:-2.25, largo:1.45, curva:-0.75, grosor:mob?0.040:0.030, fase:0.20, vel:0.078 }
  ];
}

function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = window.innerWidth;
  H = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
  cv.width=W*DPR; cv.height=H*DPR;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);

  cw = isMobile() ? CELL*0.85 : CELL;
  ch = cw*1.7;
  cols = Math.ceil(W/cw)+1;
  rows = Math.ceil(H/ch)+1;
  low.width=cols; low.height=rows;
  sembrar();
}

let t=0;
function frame(){
  t += 0.006;

  // 1) los brazos, en la retícula reducida
  lctx.setTransform(1,0,0,1,0,0);
  lctx.fillStyle='#fff'; lctx.fillRect(0,0,cols,rows);
  const D = Math.max(cols,rows);
  for(const b of BRAZOS){
    const c = (t*b.vel + b.fase) % 1;
    const ext = Math.pow(Math.min(1, c/0.88), 0.72);
    const alfa = c > 0.93 ? (1-c)/0.07 : 1;
    if(ext <= 0.02) continue;
    brazo(lctx, b.x*cols, b.y*rows, b.ang, b.largo*D, b.curva, b.grosor*D, ext, alfa);
  }

  // 2) traducir a caracteres
  const img = lctx.getImageData(0,0,cols,rows).data;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#15150f';
  ctx.font = `400 ${ch*0.95}px 'JetBrains Mono', monospace`;
  ctx.textBaseline='alphabetic';
  const N = RAMPA.length-1;

  for(let r=0;r<rows;r++){
    // el cabezal pierde sincronía en algunas filas: arrastre, no glitch
    const desf = Math.round(Math.sin(r*0.19 + t*1.4)*1.1
               + (Math.sin(t*0.55) > 0.88 ? Math.sin(r*2.7)*3 : 0));
    const rr = Math.max(0, Math.min(rows-1, r+desf));
    let linea='';
    for(let c=0;c<cols;c++){
      const i=(c+rr*cols)*4;
      const lum=(img[i]*0.2126+img[i+1]*0.7152+img[i+2]*0.0722)/255;
      linea += RAMPA[Math.round((1-lum)*N)];
    }
    ctx.fillText(linea, 0, (r+1)*ch);
  }
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=> setTimeout(resize,150));
if(window.visualViewport) window.visualViewport.addEventListener('resize', resize);

(document.fonts && document.fonts.load
  ? document.fonts.load("400 20px 'JetBrains Mono'").then(()=>document.fonts.ready).catch(()=>{})
  : Promise.resolve()
).then(()=>{ resize(); frame(); [200,700].forEach(ms=>setTimeout(resize,ms)); });
</script>
</body>
</html>
