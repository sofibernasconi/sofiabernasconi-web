<script>

  {id:"reflejo", name:"Reflejo Abierto", en:"Open Reflection", year:"2025"},

];
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
const PREV={convey:"sofia-bernasconi-convey-me-1.jpg",reflejo:"sofia-bernasconi-reflejo-abierto-1.jpg",orilla:"sofia-bernasconi-orilla-1.jpg",mecanica:"sofia-bernasconi-mecanica-del-tacto-3.jpg",tensiones:"sofia-bernasconi-tensiones-1.jpg",cuerpoaguas:"sofia-bernasconi-mi-cuerpo-toca-tus-aguas-1.jpg",cordeles:"sofia-bernasconi-cortina-de-cordeles-2.jpg",sumersiones:"sofia-bernasconi-sumersiones-1.jpg",residente:"sofia-bernasconi-residente-1.jpg",deshilacha:"sofia-bernasconi-deshilacha-1.jpg",sumersiones0:"sofia-bernasconi-bajo-el-agua-2.jpg",artwork:"sofia-bernasconi-portada-disco-1.jpg"};
const WHITECAP=['cordeles'];

document.getElementById('list').innerHTML = PROJ.map(function(p){
  var img = PREV[p.id] ? '<img src="assets/'+PREV[p.id]+'" alt="'+esc((document.documentElement.lang==='en'&&p.en)||p.name)+' ('+esc(p.year)+'), '+(document.documentElement.lang==='en'?'work by Chilean artist Sofía Bernasconi':'obra de la artista chilena Sofía Bernasconi')+'"'+(POS[p.id]?' style="object-position:'+POS[p.id]+'"':'')+' loading="lazy">' : '';
  var wc=WHITECAP.indexOf(p.id)>=0?' wcap':'';
  return '<a class="strip'+wc+'" href="obra-'+p.id+'.html">'+img+'<span class="cap"><span class="n">'+(p.en?'<span class="tes">'+esc(p.name)+'</span><span class="ten">'+esc(p.en)+'<span class="orig"> ('+esc(p.name)+')</span></span>':esc(p.name))+'</span><span class="y">'+esc(p.year)+'</span></span></a>';
}).join('');


// ---- contraste automatico de los titulos ----
// CSS no sabe que hay detras del texto: medimos la zona de la imagen bajo el titulo
// y elegimos blanco solido, negro solido o el efecto de inversion.
(function(){
  function analiza(img){
    var strip = img.closest('.strip');
    if(!strip || strip.classList.contains('wcap')) return;
    try{
      var c=document.createElement('canvas'), w=32, h=16;
      c.width=w; c.height=h;
      var ctx=c.getContext('2d',{willReadFrequently:true});
      // zona izquierda de la foto: es donde va el titulo
      var sw=img.naturalWidth*0.42, sh=img.naturalHeight;
      ctx.drawImage(img, 0, 0, sw, sh, 0, 0, w, h);
      var d=ctx.getImageData(0,0,w,h).data, sum=0, n=0;
      for(var i=0;i<d.length;i+=4){
        sum += (0.2126*d[i] + 0.7152*d[i+1] + 0.0722*d[i+2])/255;
        n++;
      }
      var L = sum/n;
      // con inversion, el texto se pierde cuando el fondo es tono medio
      if(L>0.38 && L<0.62) strip.classList.add("midtone");
      else if(L>=0.62) strip.classList.add("lighttone");
    }catch(e){ /* si el navegador bloquea la lectura, se queda con la inversion */ }
  }
  document.querySelectorAll('.strip img').forEach(function(img){
    if(img.complete && img.naturalWidth) analiza(img);
    else img.addEventListener('load', function(){ analiza(img); });
  });
})();

// idioma (persistente entre páginas)
(function(){
  function withLang(href,l){ if(!href||/^(https?:|mailto:|tel:|#)/i.test(href))return href; var hash='';var h=href.indexOf('#');if(h>=0){hash=href.slice(h);href=href.slice(0,h);} var base=href,qs='';var q=href.indexOf('?');if(q>=0){base=href.slice(0,q);qs=href.slice(q+1);} var pr=new URLSearchParams(qs);pr.set('lang',l);return base+'?'+pr.toString()+hash; }
  const set=l=>{
    document.body.classList.toggle('en',l==='en');
    document.querySelectorAll('nav a[data-'+l+'],.eyebrow[data-'+l+']').forEach(el=>el.textContent=el.getAttribute('data-'+l));
    document.querySelectorAll('#lang span').forEach(s=>s.classList.toggle('on',s.getAttribute('data-l')===l));
    try{localStorage.setItem('lang',l);}catch(e){}
    document.querySelectorAll('a[href]').forEach(a=>a.setAttribute('href',withLang(a.getAttribute('href'),l)));
  };
  document.querySelectorAll('#lang span').forEach(s=>s.addEventListener('click',()=>set(s.getAttribute('data-l'))));
  var u=new URLSearchParams(location.search).get('lang'),st=null;try{st=localStorage.getItem('lang');}catch(e){}
  set(st||u||'es');
})();

<script>
// ==== MINI LOGO ANIMADO (igual que bio / obra) ====
new p5(function(p){
  let img, parts=[], W, H, blur, mx=-999, my=-999, hoverAmt=0;
  let nbx0=0,nby0=0,nbx1=0,nby1=0;
  const FONT='Syne', R=160, VSTRETCH=1.55, LS=(window.innerWidth<700?0.30:0.30), LOX=34, LOY=30;
  function makeText(){
    const fs=200, mob=window.innerWidth<700;
    const m=p.createGraphics(10,10); m.textFont(FONT); m.textStyle(p.BOLD); m.textSize(fs);
    let g;
    if(mob){
      const lines=['SOFIA','BERNASCONI']; let tw=0;
      for(const l of lines) tw=Math.max(tw, Math.ceil(m.textWidth(l)));
      m.remove();
      const lead=fs*1.04;
      g=p.createGraphics(tw+40, Math.ceil(lead*(lines.length-1)+fs*1.25)); g.pixelDensity(1);
      g.background(255); g.fill(0); g.noStroke();
      g.textFont(FONT); g.textStyle(p.BOLD); g.textSize(fs); g.textAlign(p.LEFT,p.CENTER);
      const cy=g.height/2 - lead*(lines.length-1)/2;
      lines.forEach((l,i)=>g.text(l, 20, cy+i*lead));
    } else {
      m.drawingContext.wordSpacing='75px';
      const txt='SOFIA BERNASCONI', tw=Math.ceil(m.textWidth(txt)); m.remove();
      g=p.createGraphics(tw+40, Math.ceil(fs*1.35)); g.pixelDensity(1);
      g.background(255); g.fill(0); g.noStroke();
      g.textFont(FONT); g.textStyle(p.BOLD); g.textSize(fs); g.textAlign(p.CENTER,p.CENTER); g.drawingContext.wordSpacing='75px';
      g.text(txt, g.width/2, g.height/2);
    }
    g.loadPixels();
    return g;
  }
  function setHomes(){
    const tw=(W<700? W*0.92 : Math.min(W*0.72,900)), s=tw/img.width, h=img.height*s*VSTRETCH;
    const ox=(W-tw)/2, oy=(H-h)/2; nbx0=ox; nby0=oy; nbx1=ox+tw; nby1=oy+h;
    for(const q of parts){ q.hx=ox+q.ix*s; q.hy=oy+q.iy*s*VSTRETCH; q.hyL=(q.iy % (img.height/2))*s*VSTRETCH;   /* fase de la onda sin depender de la posición en pantalla: no salta cuando el teléfono cambia de alto al scrollear */ }
  }
  function build(){
    parts=[]; W=window.innerWidth; H=window.innerHeight; img.loadPixels();
    const s=(W<700? W*0.92 : Math.min(W*0.72,900))/img.width, step=Math.max(2,Math.round((W<700?1.8:2.4)/s));
    for(let y=0;y<img.height;y+=step) for(let x=0;x<img.width;x+=step)
      if(img.pixels[4*(x+y*img.width)]<115) parts.push({ix:x,iy:y,ox:0,oy:0,ovx:0,ovy:0,ev:0,seed:p.random(1000),sz:p.random(0.5,1.15)});
    setHomes();
  }
  function inName(x,y){ const w=(nbx1-nbx0)*LS, hh=(nby1-nby0)*LS; return x>=LOX&&x<=LOX+w&&y>=LOY&&y<=LOY+hh; }
  p.setup=function(){
    W=window.innerWidth; H=window.innerHeight;
    let c=p.createCanvas(W,H); c.parent('c'); p.pixelDensity(Math.min(2, window.devicePixelRatio||1));
    blur=p.createGraphics(W,H); blur.pixelDensity(1); blur.elt.id='blurlayer'; document.body.appendChild(blur.elt);
    const boot=()=>{ img=makeText(); build(); };
    if(document.fonts&&document.fonts.load){ document.fonts.load('700 120px \"'+FONT+'\"').then(boot).catch(boot); } else boot();
    window.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY; document.body.style.cursor=inName(mx,my)?'pointer':'default';});
    window.addEventListener('click',e=>{ if(inName(e.clientX,e.clientY)){ var u=new URLSearchParams(location.search).get('lang'),s=null;try{s=localStorage.getItem('lang')}catch(x){} window.location.href='index.html?lang='+(s||u||'es')+'#open'; } });
    window.addEventListener('mouseout',()=>{mx=-999;my=-999;});
  };
  p.draw=function(){
    p.clear(); blur.clear();
    hoverAmt+=((inName(mx,my)?1:0)-hoverAmt)*0.11;
    const act=1, t=p.frameCount*0.003, wt=p.frameCount*0.01;   // igual que el logo chico de la portada: siempre con su movimiento
    const cX=LOX+(nbx1-nbx0)*LS/2, cY=LOY+(nby1-nby0)*LS/2;
    for(const q of parts){
      const hx=LOX+(q.hx-nbx0)*LS, hy=LOY+(q.hy-nby0)*LS;
      const wv=(W<700?q.hyL:q.hy);   // móvil: y relativa a cada línea -> SOFIA y BERNASCONI en fase (misma dirección), misma onda de antes
      const waveX=( Math.sin(wv*0.07 - wt*1.2)*20 + Math.sin(wv*0.15 + wt*0.8)*8 )*(1-q.ev)*LS*act;
      const baseX=hx+waveX, baseY=hy;
      const px=baseX+q.ox, py=baseY+q.oy;
      const k=0.016*(1-0.99*q.ev);
      let ax=-q.ox*k, ay=-q.oy*k;
      ax += (p.noise(q.seed,t)-0.5)*0.05*LS*act;
      const Reff=R*LS, dx=px-mx, dy=py-my, d=Math.hypot(dx,dy);
      if(d<Reff){ q.ev=Math.min(1, q.ev+(1-d/Reff)*0.09); }
      if(q.ev>0.02){
        const a=p.noise(px*0.0016, py*0.0016, t*0.4)*p.TWO_PI*2.0, drift=0.5*q.ev*LS*act;
        ax+=Math.cos(a)*drift; ay+=Math.sin(a)*drift;
        ax+=(px-cX)*0.00075*q.ev*LS*act; ay+=(py-cY)*0.00075*q.ev*LS*act;
      }
      q.ev*=0.991; const fr=0.92+0.05*q.ev;
      q.ovx=(q.ovx+ax)*fr; q.ovy=(q.ovy+ay)*fr;
      const cap=3.2*Math.max(LS,0.5), sp=Math.hypot(q.ovx,q.ovy); if(sp>cap){ q.ovx*=cap/sp; q.ovy*=cap/sp; }
      q.ox+=q.ovx; q.oy+=q.ovy;
      const dpx=baseX+q.ox, dpy=baseY+q.oy, dot=q.sz*1.5*Math.max(LS,0.62)*(window.innerWidth<700?0.7:1);
      p.noStroke(); blur.noStroke();
      const aC=255*(1-q.ev);
      if(aC>4){ p.fill(255,255,255,aC); p.circle(dpx,dpy, dot); }
      const bA=150*q.ev;
      if(q.ev>0.03){ blur.fill(255,255,255,bA); blur.circle(dpx,dpy, dot+q.ev*3*LS); }
    }
  };
  let to; p.windowResized=function(){ W=window.innerWidth; H=window.innerHeight; p.resizeCanvas(W,H); blur.resizeCanvas(W,H); clearTimeout(to); to=setTimeout(()=>{ if(img) setHomes(); },120); };
});
</script>

<script>(function(){
  function L(){var u=null,s=null;try{u=new URLSearchParams(location.search).get('lang');}catch(e){}try{s=localStorage.getItem('lang');}catch(e){}return s||u||'es';}
  document.addEventListener('click',function(e){
    var a=e.target&&e.target.closest?e.target.closest('a[href]'):null; if(!a)return;
    var h=a.getAttribute('href'); if(!h||/^(https?:|mailto:|tel:)/i.test(h)||h.charAt(0)==='#')return;
    var l=L(),hash='',hi=h.indexOf('#'); if(hi>=0){hash=h.slice(hi);h=h.slice(0,hi);}
    var base=h,qs='',qi=h.indexOf('?'); if(qi>=0){base=h.slice(0,qi);qs=h.slice(qi+1);}
    var pr; try{pr=new URLSearchParams(qs);}catch(e){pr=new URLSearchParams();}
    pr.set('lang',l); a.setAttribute('href', base+'?'+pr.toString()+hash);
  }, true);
})();</script>

  /* abierto: las barritas se quedan igual y el menú vuelve a aparecer */
  body.ui-hide.mm-open nav,body.ui-hide.mm-open #menu{opacity:1 !important;transform:none;pointer-events:auto}
  body.ui-hide.mm-open #lang{opacity:1 !important;pointer-events:auto;right:76px}

  body.ui-hide.mm-open #c,body.ui-hide.mm-open #blurlayer{opacity:1 !important}
  /* en la portada el menú es negro: al abrirlo sobre fotos, que se lea igual que en las otras páginas */
  body.ui-hide.mm-open #menu,body.ui-hide.mm-open #lang{mix-blend-mode:difference;color:#fff}

  @media(max-width:700px){ #mm{top:22px;right:18px} body.ui-hide.mm-open #lang{right:66px} }
</style>
<button id="mm" type="button" aria-expanded="false"><i></i><i></i><i></i></button>
<script>(function(){
  var b=document.getElementById('mm'), B=document.body; if(!b) return;
  var en=(document.documentElement.lang||'').indexOf('en')===0;
  b.setAttribute('aria-label', en?'Menu':'Menú');
  function st(){return window.pageYOffset||document.documentElement.scrollTop||B.scrollTop||0;}
  var y0=0;
  function set(o){ B.classList.toggle('mm-open',o); b.setAttribute('aria-expanded',o?'true':'false'); if(o) y0=st(); }
  b.addEventListener('click',function(e){ e.stopPropagation(); set(!B.classList.contains('mm-open')); });
  document.addEventListener('click',function(e){
    if(!B.classList.contains('mm-open')) return;
    if(e.target.closest && e.target.closest('nav,#menu,#lang,#mm')) return;
    set(false);
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') set(false); });
  function sc(){
    if(!B.classList.contains('ui-hide')){ if(B.classList.contains('mm-open')) set(false); return; }
    if(B.classList.contains('mm-open') && Math.abs(st()-y0)>80) set(false);
  }
  window.addEventListener('scroll',sc,{passive:true,capture:true});
  document.addEventListener('scroll',sc,{passive:true,capture:true});
})();</script>
<!--/MINI-MENU-->
<!--UI-HIDE-ON-SCROLL-->
<script>(function(){
  function getST(){return window.pageYOffset||document.documentElement.scrollTop||document.body.scrollTop||0;}
  var last=0;
  function on(){
    var s=getST();
    if(s<40) document.body.classList.remove('ui-hide');
    else if(s>last) document.body.classList.add("ui-hide");
    else if(s<last) document.body.classList.remove("ui-hide");
    last=s;
  }
  window.addEventListener('scroll', on, {passive:true, capture:true});
  document.addEventListener('scroll', on, {passive:true, capture:true});
})();</script>
