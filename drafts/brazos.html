<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex">
<title>Sofía Bernasconi</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{ --fondo:#efeeea; --tinta:#15150f; }
  html,body{height:100%;overflow:hidden;background:var(--fondo)}
  body{font-family:'JetBrains Mono',monospace;touch-action:none}
  canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%}
  .meta{position:fixed;z-index:10;font-size:10px;letter-spacing:.26em;
        text-transform:uppercase;color:var(--tinta);opacity:.4;pointer-events:none}
  .meta.bl{bottom:4vh;left:5vw}
  .meta.br{bottom:4vh;right:5vw}
  @media(max-width:700px){ .meta{font-size:9px;letter-spacing:.18em}
    .meta.bl,.meta.br{bottom:3vh} }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="meta bl">Sofía Bernasconi</div>
<div class="meta br">2026</div>

<script>
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
const off = document.createElement('canvas');       // donde viven los brazos
const octx = off.getContext('2d');
let W, H, DPR;

function isMobile(){ return window.innerWidth < 760; }

/* ---------------------------------------------------------------------------
   Un brazo: una columna de segmentos que se va afinando. No hay anatomía
   correcta; el brazo se alarga mucho más de lo que un brazo puede alargarse.
--------------------------------------------------------------------------- */
function brazo(g, x0, y0, ang0, largo, curva, grosor, ext, alfa){
  const N = 64;
  const L = largo * ext;                 // lo que lleva extendido
  const paso = L / N;
  let x = x0, y = y0, a = ang0;
  const pts = [];
  for(let i=0;i<=N;i++){
    const s = i/N;
    pts.push({x, y, r: grosor*(1 - 0.62*s)});
    a += curva*(0.35 + s*1.25)/N;
    x += Math.cos(a)*paso;
    y += Math.sin(a)*paso;
  }
  g.save();
  g.globalAlpha = alfa;
  g.strokeStyle = '#15150f';
  g.fillStyle   = '#15150f';
  g.lineCap = 'round';
  g.lineJoin = 'round';
  for(let i=0;i<N;i++){
    g.beginPath();
    g.lineWidth = pts[i].r*2;
    g.moveTo(pts[i].x, pts[i].y);
    g.lineTo(pts[i+1].x, pts[i+1].y);
    g.stroke();
  }

  // la mano: se abre al final del recorrido
  const p  = pts[N], q = pts[N-1];
  const dx = p.x-q.x, dy = p.y-q.y;
  const d  = Math.hypot(dx,dy) || 1;
  const ux = dx/d, uy = dy/d;
  const r  = p.r;
  const abrir = Math.max(0, Math.min(1, (ext-0.35)/0.5));

  g.beginPath();                                   // palma
  g.ellipse(p.x+ux*r*0.6, p.y+uy*r*0.6, r*1.25, r*1.05,
            Math.atan2(uy,ux), 0, Math.PI*2);
  g.fill();

  for(let f=0; f<5; f++){
    const spread = (f-2)/2;                        // -1 .. 1
    const ang = Math.atan2(uy,ux) + spread*0.52*abrir;
    const largoF = r*(f===0 ? 1.7 : f===4 ? 2.0 : 2.9 - Math.abs(spread)*0.5)
                 * (0.55 + abrir*0.85);
    const bx = p.x + ux*r*1.1, by = p.y + uy*r*1.1;
    const M = 5;
    let fx = bx, fy = by, fa = ang;
    for(let k=0;k<M;k++){
      const s = k/M;
      const nx = fx + Math.cos(fa)*(largoF/M);
      const ny = fy + Math.sin(fa)*(largoF/M);
      g.beginPath();
      g.lineWidth = r*(0.42 - 0.22*s);
      g.moveTo(fx,fy); g.lineTo(nx,ny); g.stroke();
      fx=nx; fy=ny; fa += spread*0.16;
    }
  }
  g.restore();
}

/* --------------------------------------------------------------------------- */
let BRAZOS = [];
function sembrar(){
  const mob = isMobile();
  // origen fuera de cuadro: los brazos entran desde el borde
  BRAZOS = [
    { x:-0.06, y: 0.82, ang:-0.62, largo: 1.55, curva:-0.55, grosor: mob?0.055:0.042, fase:0.00, vel:0.085 },
    { x: 1.06, y: 0.66, ang: 3.42, largo: 1.35, curva: 0.70, grosor: mob?0.048:0.036, fase:0.38, vel:0.070 },
    { x: 0.34, y: 1.08, ang:-1.34, largo: 1.20, curva: 0.85, grosor: mob?0.042:0.031, fase:0.62, vel:0.095 },
    { x:-0.04, y: 0.28, ang: 0.42, largo: 1.10, curva: 0.60, grosor: mob?0.036:0.027, fase:0.81, vel:0.062 },
    { x: 1.05, y: 1.02, ang:-2.25, largo: 1.45, curva:-0.75, grosor: mob?0.040:0.030, fase:0.20, vel:0.078 }
  ];
}

let t = 0;

function dibujarBrazos(){
  octx.setTransform(DPR,0,0,DPR,0,0);
  octx.clearRect(0,0,W,H);
  const D = Math.max(W,H);
  for(const b of BRAZOS){
    const ciclo = (t*b.vel + b.fase) % 1;
    // se extiende despacio y se retira de golpe, como una toma que se corta
    const ext = Math.pow(Math.min(1, ciclo/0.88), 0.72);
    const alfa = ciclo > 0.93 ? (1-ciclo)/0.07 : 1;
    if(ext <= 0.02) continue;
    brazo(octx, b.x*W, b.y*H, b.ang, b.largo*D, b.curva,
          b.grosor*D, ext, alfa);
  }
}

/* ---- el mismo raspado de fotocopiadora: la extensión también arrastra ----- */
const BAND_H = 4;
let BANDS = [];
function buildBands(){
  BANDS = [];
  for(let y=0; y<H; y+=BAND_H) BANDS.push({ y, h: Math.min(BAND_H, H-y) });
}

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  off.width = W*DPR; off.height = H*DPR;
  sembrar(); buildBands();
}

let ciclo = 0;
function frame(){
  t += 0.006;
  ciclo += 0.0013;
  dibujarBrazos();

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  const n = BANDS.length;
  if(!n){ requestAnimationFrame(frame); return; }

  const PERIODO = H*2.1;
  const f1 = ((ciclo % 1) * PERIODO) - H*0.5;
  const A1 = H*0.72;

  const dens = new Float32Array(n);
  let suma = 0;
  for(let i=0;i<n;i++){
    const y = BANDS[i].y;
    let d = 1;
    const d1 = y - f1;
    if(d1 > 0 && d1 < A1) d *= 1 - 0.93*Math.pow(1 - d1/A1, 0.28);
    dens[i] = Math.max(0.01, d);
    suma += dens[i];
  }
  const norm = H/suma;

  let src = 0;
  for(let i=0;i<n;i++){
    const b = BANDS[i];
    const sh = Math.max(0.4, dens[i]*norm);
    const estirado = 1 - Math.min(1, dens[i]);
    const paso = 1 + estirado*5;
    const sQ = Math.floor(src/paso)*paso;

    if(estirado > 0.25){
      const a = (estirado-0.25)*0.5;
      ctx.globalAlpha = a*0.5;
      ctx.drawImage(off, 0, Math.max(0,sQ-10)*DPR, off.width, sh*DPR, 0, b.y, W, b.h);
      ctx.globalAlpha = a*0.28;
      ctx.drawImage(off, 0, Math.max(0,sQ-26)*DPR, off.width, sh*DPR, 0, b.y, W, b.h);
      ctx.globalAlpha = 1;
    }
    ctx.drawImage(off, 0, Math.min(H-0.4,sQ)*DPR, off.width, sh*DPR, 0, b.y, W, b.h);
    src += sh;
  }
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=> setTimeout(resize,150));
if(window.visualViewport) window.visualViewport.addEventListener('resize', resize);

resize(); frame();
[200,700].forEach(ms=>setTimeout(resize,ms));
</script>
</body>
</html>
