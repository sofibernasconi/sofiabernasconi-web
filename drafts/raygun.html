<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex">
<title>Sofía Bernasconi</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{ --fondo:#efeeea; --tinta:#1a1a18; --nota:#2a2a26; }
  html,body{height:100%;overflow:hidden;background:var(--fondo)}
  body{font-family:'JetBrains Mono',monospace;touch-action:none}
  canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%;image-rendering:pixelated}
  /* anotaciones al margen, como fichas tecnicas sobre la imagen */
  .nota{position:fixed;z-index:10;font-size:9.5px;line-height:1.5;letter-spacing:.14em;
        text-transform:uppercase;color:var(--nota);pointer-events:none;display:flex;
        align-items:flex-start;gap:.45rem}
  .nota::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--tinta);
                flex:0 0 auto;margin-top:.28em}
  .n1{top:7vh;left:6vw}
  .n2{bottom:12vh;left:6vw}
  .n3{top:11vh;right:6vw}
  .n4{bottom:6vh;right:6vw}
  @media(max-width:700px){
    .nota{font-size:8px;letter-spacing:.1em}
    .n1{top:5vh;left:5vw} .n2{bottom:16vh;left:5vw}
    .n3{top:8vh;right:5vw} .n4{bottom:5vh;right:5vw}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="nota n1">Artes mediales<br>videoinstalación</div>
<div class="nota n2">Concepción CL<br>New York US</div>
<div class="nota n3">2026</div>
<div class="nota n4">cuerpo · técnica<br>umbral</div>

<script>
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H, DPR;

// Lienzo de baja resolucion: todo se compone aqui y luego se amplia sin
// suavizado. De ahi el pixel gordo de la estetica de 8 bits.
const low  = document.createElement('canvas');
const lctx = low.getContext('2d', {willReadFrequently:true});
const ESCALA = 3.2;                 // cuanto mas alto, mas gordo el pixel

// Bayer 8x8: el tramado ordenado clasico de la impresion de un bit
const BAYER = [
  [ 0,32, 8,40, 2,34,10,42],[48,16,56,24,50,18,58,26],
  [12,44, 4,36,14,46, 6,38],[60,28,52,20,62,30,54,22],
  [ 3,35,11,43, 1,33, 9,41],[51,19,59,27,49,17,57,25],
  [15,47, 7,39,13,45, 5,37],[63,31,55,23,61,29,53,21]
];

function isMobile(){ return window.innerWidth < 760; }

let t = 0;
let LW, LH;

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled = false;

  LW = Math.max(80, Math.round(W/ESCALA));
  LH = Math.max(80, Math.round(H/ESCALA));
  low.width = LW; low.height = LH;
  lctx.imageSmoothingEnabled = true;
}

// ---- composicion: la masa gris que luego se trama --------------------------
function componer(){
  lctx.setTransform(1,0,0,1,0,0);
  lctx.clearRect(0,0,LW,LH);
  lctx.fillStyle = '#fff';
  lctx.fillRect(0,0,LW,LH);

  // 1) forma de fondo: un degradado que al tramarse se vuelve textura
  const cx = LW*(0.34 + Math.sin(t*0.21)*0.05);
  const cy = LH*(0.48 + Math.cos(t*0.17)*0.06);
  const R  = Math.max(LW,LH)*0.52;
  const g = lctx.createRadialGradient(cx, cy, R*0.05, cx, cy, R);
  g.addColorStop(0,   'rgba(0,0,0,0.90)');
  g.addColorStop(0.45,'rgba(0,0,0,0.42)');
  g.addColorStop(1,   'rgba(0,0,0,0)');
  lctx.fillStyle = g;
  lctx.beginPath();
  lctx.ellipse(cx, cy, R*0.86, R*0.72, Math.sin(t*0.13)*0.25, 0, Math.PI*2);
  lctx.fill();

  // banda inferior: otro degradado, mas plano
  const g2 = lctx.createLinearGradient(0, LH*0.62, 0, LH);
  g2.addColorStop(0, 'rgba(0,0,0,0)');
  g2.addColorStop(1, 'rgba(0,0,0,0.55)');
  lctx.fillStyle = g2;
  lctx.fillRect(0, LH*0.62, LW, LH*0.38);

  // 2) el nombre, deconstruido: distintas escalas, desalineado, cortado
  lctx.fillStyle = '#000';
  lctx.textBaseline = 'alphabetic';
  const mob = isMobile();

  function palabra(txt, anchoRel, xRel, yRel, rot, aplastar){
    lctx.save();
    lctx.translate(LW*xRel, LH*yRel);
    lctx.rotate(rot);
    let fs = 100;
    lctx.font = `400 ${fs}px 'Archivo Black', Inter, sans-serif`;
    const w = lctx.measureText(txt).width || 1;
    fs = fs * (LW*anchoRel) / w;
    lctx.font = `400 ${fs}px 'Archivo Black', Inter, sans-serif`;
    lctx.scale(1, aplastar);
    lctx.fillText(txt, 0, 0);
    lctx.restore();
  }

  if(mob){
    palabra('SOFIA',      1.18, -0.09, 0.30,  0.000, 1.35);
    palabra('BERNAS',     1.24, -0.14, 0.545, 0.018, 1.10);
    palabra('CONI',       0.82,  0.22, 0.78, -0.010, 1.55);
  } else {
    palabra('SOFIA',      0.62, -0.04, 0.42,  0.000, 1.55);
    palabra('BERNASCONI', 1.02,  0.04, 0.78,  0.014, 0.92);
  }

  // 3) una franja del nombre repetida, corrida: el error dentro de la composicion
  const bh = LH*0.09;
  const by = LH*(0.36 + Math.sin(t*0.4)*0.10);
  lctx.drawImage(low, 0, by, LW, bh, Math.sin(t*0.7)*LW*0.06, by, LW, bh);
}

// ---- tramado de 1 bit -------------------------------------------------------
function tramar(){
  const img = lctx.getImageData(0,0,LW,LH);
  const d = img.data;
  for(let y=0;y<LH;y++){
    for(let x=0;x<LW;x++){
      const i = (x + y*LW)*4;
      // luminancia sobre blanco
      const lum = (d[i]*0.2126 + d[i+1]*0.7152 + d[i+2]*0.0722);
      const umbral = (BAYER[y & 7][x & 7] + 0.5) * (255/64);
      const on = lum < umbral;          // negro donde la luz no alcanza
      const v = on ? 26 : 239;
      d[i] = v; d[i+1] = v; d[i+2] = v - 4; d[i+3] = 255;
    }
  }
  lctx.putImageData(img, 0, 0);
}

function frame(){
  t += 0.006;
  componer();
  tramar();
  ctx.clearRect(0,0,W,H);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(low, 0, 0, LW, LH, 0, 0, W, H);
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=> setTimeout(resize,150));
if(window.visualViewport) window.visualViewport.addEventListener('resize', resize);

(document.fonts && document.fonts.load
  ? Promise.all([
      document.fonts.load("400 100px 'Archivo Black'"),
      document.fonts.load('700 100px Inter')
    ]).then(()=>document.fonts.ready).catch(()=>{})
  : Promise.resolve()
).then(()=>{ resize(); frame(); [200,700].forEach(ms=>setTimeout(resize,ms)); });
</script>
</body>
</html>
